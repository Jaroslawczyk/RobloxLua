<!doctype html>

    <script>
      /* применяем тему до отрисовки, чтобы не было вспышки */
      try {
        var s = JSON.parse(localStorage.getItem('rl.v1') || '{}');
        if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
